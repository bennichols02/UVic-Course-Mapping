name: Build apps

# Push a tag like v0.1.0 to build the Mac and Windows apps and publish them as a GitHub release.
# "Run workflow" from the Actions tab builds them as downloadable test artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: UVic Course Mapping
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: UVic-Course-Mapping-macOS.zip
          - os: macos-15-intel
            asset: UVic-Course-Mapping-macOS-Intel.zip
          - os: windows-latest
            asset: UVic-Course-Mapping-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed \
            --name "$APP_NAME" \
            --icon assets/icon.icns \
            --osx-bundle-identifier io.github.bennichols02.uvic-course-mapping \
            --add-data "course_graph.json:." \
            --add-data "assets/icon-256.png:assets" \
            course_gui.py
          ditto -c -k --keepParent "dist/$APP_NAME.app" "${{ matrix.asset }}"

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --name "$APP_NAME" \
            --icon assets/icon.ico \
            --add-data "course_graph.json:." \
            --add-data "assets/icon-256.png:assets" \
            course_gui.py
          cp "dist/$APP_NAME.exe" "${{ matrix.asset }}"

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
